# suppress inspection "LossyEncoding" for whole file
spring.application.name=library-management

# ??? App Info ???????????????????????????????????????????
app.name=Library Management API
app.version=1.0.0

# ??? Library Business Rules ?????????????????????????????
library.loan-period-days=14
library.max-active-borrows-per-member=3

# ??? H2 In-Memory Database ??????????????????????????????
spring.datasource.url=jdbc:h2:file:./data/librarydb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ??? JPA / Hibernate ????????????????????????????????????
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ??? H2 Web Console (for debugging) ?????????????????????
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ??? Server ?????????????????????????????????????????????
server.port=8080

# ??? OpenAPI / Swagger ???????????????????????????????????
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ??? Pagination Defaults ?????????????????????????????????
spring.data.web.pageable.default-page-size=5
spring.data.web.pageable.max-page-size=100